services:
  - type: web
    name: risk-gate-demo
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_TOKEN
        sync: false        # set this in the Render dashboard — a shared secret for demo callers
      - key: BIND
        value: 0.0.0.0
      - key: TRUSTED_CUSTOM_HOSTS
        value: 127.0.0.1,localhost
